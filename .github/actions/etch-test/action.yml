name: 'Etch API Snapshot Test'
description: 'Install Etch and run API snapshot tests'

inputs:
  version:
    description: 'Etch version to install (e.g., v1.0.0). If empty, builds from source.'
    required: false
    default: ''
  port:
    description: 'Proxy port for etch test'
    required: false
    default: '8080'
  snap-dir:
    description: 'Snapshot directory path'
    required: false
    default: '.etch/snapshots'

runs:
  using: 'composite'
  steps:
    - name: Install Etch
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          case "${ARCH}" in
            x86_64)  ARCH="amd64" ;;
            aarch64) ARCH="arm64" ;;
          esac
          URL="https://github.com/ojuschugh1/etch/releases/download/${{ inputs.version }}/etch-${OS}-${ARCH}"
          echo "Downloading Etch ${URL}"
          curl -fsSL -o /usr/local/bin/etch "${URL}"
          chmod +x /usr/local/bin/etch
        else
          echo "No version specified, building from source"
          go build -o /usr/local/bin/etch ./cmd/etch
        fi
        etch version

    - name: Run Etch tests
      shell: bash
      run: |
        etch test --port ${{ inputs.port }} --snap-dir ${{ inputs.snap-dir }} --ci
